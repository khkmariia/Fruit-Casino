<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            color: #4a3540;
            background: linear-gradient(135deg, #fff5ec, #fce4ec, #fff0dc);
        }
        .game-container {
            width: 100%;
            max-width: 650px;
            padding: 35px;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid #f4d7dc;
            border-radius: 28px;
            box-shadow: 0 15px 45px rgba(125, 70, 85, 0.15);
        }
        .subtitle {
            margin-bottom: 8px;
            color: #d8798e;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        h1 {
            margin-bottom: 12px;
            color: #b94d70;
            font-size: clamp(27px, 5vw, 39px);
        }
        .welcome {
            margin-bottom: 22px;
            color: #806c75;
            font-size: 16px;
        }
        .info-panel {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .info-card {
            min-width: 145px;
            padding: 12px 20px;
            background: #fff1f3;
            border: 1px solid #f4d5de;
            border-radius: 15px;
            font-size: 14px;
        }
        .info-card span {
            color: #b94d70;
            font-weight: bold;
        }
        .game-board {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 18px;
            background: linear-gradient(145deg, #fff9f4, #fff0f3);
            border: 2px solid #f2d6dc;
            border-radius: 22px;
        }
        .row {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .item {
            width: 110px;
            height: 110px;
            flex: 1;
            max-width: 110px;
            min-width: 0;
            background-color: #ffffff;
            background-position: center;
            background-repeat: no-repeat;
            background-size: 82%;
            border: 2px solid #f0dfe2;
            border-radius: 18px;
            box-shadow: 0 4px 10px rgba(120, 75, 85, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .item.spinning {
            animation: spinFruit 0.2s ease-in-out infinite alternate;
        }
        @keyframes spinFruit {
            from {
                transform: translateY(-3px) rotate(-3deg);
            }
            to {
                transform: translateY(3px) rotate(3deg);
            }
        }
        .item.highlight {
            background-color: #e8f8d9;
            border: 3px solid #79c85b;
            box-shadow: 0 0 18px rgba(121, 200, 91, 0.5);
            animation: winAnimation 0.65s ease-in-out infinite alternate;
        }
        @keyframes winAnimation {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.06);
            }
        }
        .result-message {
            min-height: 28px;
            margin: 22px 0 15px;
            color: #b94d70;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            min-width: 145px;
            padding: 14px 24px;
            color: white;
            background: linear-gradient(135deg, #e9829c, #ce5b80);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(206, 91, 128, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(206, 91, 128, 0.3);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .restart-button {
            color: #b94d70;
            background: #fff0f3;
            border: 1px solid #efc6d2;
            box-shadow: none;
        }
        .hint {
            margin-top: 22px;
            color: #9a8790;
            font-size: 13px;
            line-height: 1.6;
        }
        @media (max-width: 480px) {
            .game-container {
                padding: 22px 14px;
                border-radius: 22px;
            }
            .game-board {
                gap: 8px;
                padding: 10px;
                border-radius: 17px;
            }
            .row {
                gap: 8px;
            }
            .item {
                width: auto;
                height: auto;
                aspect-ratio: 1;
                border-radius: 12px;
                background-size: 85%;
            }
            .info-card {
                min-width: 125px;
                padding: 10px;
            }
            button {
                width: 100%;
                max-width: 260px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="game-container">
        <p class="subtitle">Fruit Casino</p>
        <h1>🍓 Fruit Machine 🍉</h1>
        <p class="welcome">
            Вітаємо, <span id="playerName">гравцю</span>!
            Час випробувати удачу!
        </p>
        <div class="info-panel">
            <div class="info-card">
                Спроба: <span id="attemptCount">0 / 3</span>
            </div>
            <div class="info-card">
                Статус: <span id="gameStatus">Готові грати</span>
            </div>
        </div>
        <div class="game-board" id="gameBoard">
            <div class="row">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
            <div class="row">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
            <div class="row">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
        </div>
        <p class="result-message" id="resultMessage" aria-live="polite">
            Натисни кнопку та спробуй виграти!
        </p>
        <div class="buttons">
            <button id="startGameButton">🎰 Грати</button>
            <button id="restartGameButton" class="restart-button"
                    style="display: none;">
                ↻ Нова гра
            </button>
        </div>
        <p class="hint">
            Три спроби — один шанс на перемогу!<br>
            Збери три однакові фрукти в одному рядку.
        </p>
    </main>
    <script>
        let playerName = prompt("Введіть ваше ім'я:");
        if (playerName === null || playerName.trim() === "") {
            playerName = "Гравець";
        } else {
            playerName = playerName.trim();
        }
        document.getElementById("playerName").textContent = playerName;
        const images = [
            "./watermelon.png",
            "./lemon.png",
            "./pear.png",
            "./bananas.png",
            "./grape.png",
            "./fruit.png"
        ];
        const MAX_ATTEMPTS = 3;
        let attempts = 0;
        let gameOver = false;
        let isSpinning = false;
        const startButton = document.getElementById("startGameButton");
        const restartButton = document.getElementById("restartGameButton");
        const attemptCount = document.getElementById("attemptCount");
        const gameStatus = document.getElementById("gameStatus");
        const resultMessage = document.getElementById("resultMessage");
        const rows = document.querySelectorAll(".row");
        startButton.addEventListener("click", startGame);
        restartButton.addEventListener("click", restartGame);
        function getRandomImage(excludeImages = []) {
            const availableImages = images.filter(
                image => !excludeImages.includes(image)
            );
            const randomIndex = Math.floor(
                Math.random() * availableImages.length
            );
            return availableImages[randomIndex];
        }
        function spinCell(item, finalImage, duration) {
            return new Promise(resolve => {
                item.classList.add("spinning");
                const flickerInterval = setInterval(() => {
                    const randomImage = getRandomImage();
                    item.style.backgroundImage = `url("${randomImage}")`;
                }, 100);
                setTimeout(() => {
                    clearInterval(flickerInterval);
                    item.style.backgroundImage = `url("${finalImage}")`;
                    item.classList.remove("spinning");
                    resolve();
                }, duration);
            });
        }
        async function startGame() {
            if (gameOver || isSpinning) {
                return;
            }
            isSpinning = true;
            attempts++;
            attemptCount.textContent = `${attempts} / ${MAX_ATTEMPTS}`;
            gameStatus.textContent = "Обертання...";
            resultMessage.textContent = "";
            startButton.disabled = true;
            document.querySelectorAll(".item").forEach(item => {
                item.classList.remove("highlight");
            });
            const finalGrid = [];
            const columnImages = [[], [], []];
            rows.forEach((row, rowIndex) => {
                finalGrid[rowIndex] = [];
                const items = row.querySelectorAll(".item");
                items.forEach((item, colIndex) => {
                    const usedImages = columnImages[colIndex];
                    const randomImage = getRandomImage(usedImages);
                    usedImages.push(randomImage);
                    finalGrid[rowIndex][colIndex] = randomImage;
                });
            });
            const spinPromises = [];
            rows.forEach((row, rowIndex) => {
                const items = row.querySelectorAll(".item");
                items.forEach((item, colIndex) => {
                    const finalImage = finalGrid[rowIndex][colIndex];
                    const duration = 1000 + colIndex * 350 + rowIndex * 100;
                    spinPromises.push(
                        spinCell(item, finalImage, duration)
                    );
                });
            });
            await Promise.all(spinPromises);
            isSpinning = false;
            const hasWon = checkWin();
            if (hasWon) {
                gameOver = true;
                gameStatus.textContent = "Перемога!";
                resultMessage.textContent =
                    `🎉 Вітаємо, ${playerName}! Ти переміг!`;
                highlightWinningCells();
                finishGame();
            } else if (attempts >= MAX_ATTEMPTS) {
                gameOver = true;
                gameStatus.textContent = "Гру завершено";
                resultMessage.textContent =
                    "Спроби закінчилися! Спробуй ще раз 🍀";
                finishGame();
            } else {
                gameStatus.textContent = "Твій хід!";
                resultMessage.textContent =
                    "Не цього разу! Спробуй ще 🍀";
                startButton.disabled = false;
            }
        }
        function checkWin() {
            for (const row of rows) {
                const items = row.querySelectorAll(".item");
                const firstImage = items[0].style.backgroundImage;
                const allSame = Array.from(items).every(
                    item => item.style.backgroundImage === firstImage
                );
                if (allSame && firstImage !== "") {
                    return true;
                }
            }
            return false;
        }
        function highlightWinningCells() {
            rows.forEach(row => {
                const items = row.querySelectorAll(".item");
                const firstImage = items[0].style.backgroundImage;
                const allSame = Array.from(items).every(
                    item => item.style.backgroundImage === firstImage
                );
                if (allSame && firstImage !== "") {
                    items.forEach(item => {
                        item.classList.add("highlight");
                    });
                }
            });
        }
        function finishGame() {
            startButton.style.display = "none";
            restartButton.style.display = "inline-block";
            startButton.disabled = false;
        }
        function restartGame() {
            attempts = 0;
            gameOver = false;
            isSpinning = false;
            attemptCount.textContent = `0 / ${MAX_ATTEMPTS}`;
            gameStatus.textContent = "Готові грати";
            resultMessage.textContent =
                "Натисни кнопку та спробуй виграти!";
            document.querySelectorAll(".item").forEach(item => {
                item.style.backgroundImage = "";
                item.classList.remove("highlight", "spinning");
            });
            startButton.style.display = "inline-block";
            startButton.disabled = false;
            restartButton.style.display = "none";
        }
    </script>
</body>
</html>
